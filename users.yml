---

- name: Boostrap user
  hosts: all
  tasks:
    - name: Add debian user
      become: true
      ansible.builtin.user:
        name: debian
        shell: /bin/bash
        groups: sudo,adm
        append: true

    - name: Set authorized key
      become: true
      ansible.posix.authorized_key:
        user: debian
        key: "{{ lookup('file', '~/.ssh/id_rsa.pub') }}"

    - name: Set user sudo
      become: true
      community.general.sudoers:
        name: debian
        user: debian
        commands: ALL
